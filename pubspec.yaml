name: asistencia_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  shared_preferences: ^2.5.6
  file_picker: ^8.1.2  # <--- TIENE QUE ESTAR ESTO
  excel: ^4.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # 📁 ATAJO PARA IMÁGENES:
  # Incluye TODAS las imágenes que metas en esta carpeta automáticamente.
  assets:
    - assets/images/

  # 🔤 TIPOGRAFÍAS:
  fonts:
    - family: FuentePrincipal # Para tus títulos
      fonts:
        - asset: assets/fonts/montserrat-bold.ttf
        - asset: assets/fonts/montserrat-semibold.ttf
          weight: 700

    - family: FuenteSecundaria # Para tus textos normales
      fonts:
        - asset: assets/fonts/poppins-regular.ttf
        - asset: assets/fonts/poppins-medium.ttf
          weight: 700

flutter_native_splash:
  color: "#4F46E5"
  android_12:
    color: "#4F46E5"
    image: assets/images/vacio.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.jpeg"
  min_sdk_android: 21 # Opcional, pero recomendado